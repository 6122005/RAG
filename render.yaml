services:
  - type: web
    name: rag-backend
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: API_KEY
        value: rag-secret-key-prod-2026
      - key: EMBEDDING_PROVIDER
        value: fast
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: DISABLE_CROSS_ENCODER
        value: "true"
      - key: EMBEDDING_MODEL
        value: fast-semantic-384
      - key: RERANKER_MODEL
        value: hybrid-rrf
      - key: CHROMA_PERSIST_DIR
        value: ./data/chromadb
      - key: DOCUMENT_STORE_DIR
        value: ./data/documents
